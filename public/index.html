<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrima aí</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <button id="sidebarToggleBtn" class="sidebar-toggle-btn" aria-label="Mostrar servidores" aria-expanded="false">☰</button>
    🖥️ Scrima aí v0.12
  </header>

  <div id="appShell">
    <!-- Discord's own leftmost strip — circular server icons for quick
         switching, additive to (not a replacement for) the full "Meus
         Servidores" list in #serverSidebar, which still owns creating a
         server and the channel drill-down. Desktop-only (see the sidebar's
         own off-canvas breakpoint) — mobile keeps using the existing list. -->
    <nav id="serverRail" class="server-rail hidden"></nav>
    <aside id="serverSidebar" class="hidden">
      <div id="serverListView">
        <div class="sidebar-section-label">Meus Servidores</div>
        <div id="myServersList" class="my-servers-list"></div>

        <div class="create-server-form">
          <input id="createServerNameInput" type="text" placeholder="Nome do novo servidor" maxlength="40">
          <button id="createServerBtn" class="btn btn-ghost btn-small">+ Criar</button>
        </div>
        <p id="createServerError" class="error"></p>
      </div>

      <div id="channelsView" class="hidden">
        <div class="channels-header">
          <button id="backToServersBtn" type="button" class="btn-link sidebar-back-link">← Voltar</button>
          <div id="selectedServerName" class="sidebar-server-name"></div>
        </div>
        <div id="channelsList" class="my-servers-list"></div>

        <div class="create-server-form">
          <input id="createChannelNameInput" type="text" placeholder="Nome do novo canal" maxlength="40">
          <button id="createChannelBtn" class="btn btn-ghost btn-small">+ Criar</button>
        </div>
        <p id="createChannelError" class="error"></p>
      </div>
    </aside>
    <div id="sidebarBackdrop" class="sidebar-backdrop hidden"></div>

    <main>
    <div id="lobby" class="card">
      <h2>Entre na sua conta</h2>

      <div id="authStatus" class="auth-status hidden">
        <span id="authAvatar" class="auth-avatar-wrap"></span>
        <span id="authName" class="auth-name"></span>
        <button id="signOutBtn" class="btn btn-ghost btn-small">Sair</button>
      </div>

      <p id="authDividerServers" class="auth-divider hidden">ou entre com um código</p>

      <div id="authForm" class="hidden">
        <label class="field">
          <span>E-mail</span>
          <input id="authEmail" type="email" placeholder="voce@exemplo.com">
        </label>
        <label class="field hidden" id="authUsernameField">
          <span>Nome de usuário</span>
          <input id="authUsername" type="text" placeholder="ex.: João" maxlength="30">
        </label>
        <label class="field">
          <span>Senha</span>
          <input id="authPassword" type="password" placeholder="••••••••">
        </label>
        <p id="authError" class="error"></p>
        <p id="authNotice" class="auth-notice hidden"></p>
        <button id="authSignInBtn" class="btn btn-primary">Entrar</button>
        <button id="authSignUpBtn" class="btn btn-primary hidden">Criar conta</button>
        <button id="authModeToggleBtn" type="button" class="btn-link">Não tem conta? Criar uma</button>
      </div>
      <p id="authDivider" class="auth-divider hidden">ou continue como convidado</p>

      <p id="welcomeBack" class="welcome-back hidden"></p>
      <div id="guestFields">
        <label class="field">
          <span>Seu Nick</span>
          <input id="usernameInput" type="text" placeholder="ex.: João" maxlength="30">
        </label>
      </div>
      <label class="field">
        <span>Código da Sala</span>
        <input id="roomCodeInput" type="text" placeholder="Deixe em branco para criar uma sala" maxlength="30">
      </label>
      <p id="lobbyError" class="error"></p>
      <button id="enterBtn" class="btn btn-primary">Entrar na Sala</button>
    </div>

    <div id="appScreen" style="display: none;">
      <div class="room-bar">
        <div class="room-bar-left">
          <span id="connectionDot" class="connection-dot disconnected" title="Conectando..."></span>
          <span class="room-code-wrap">
            <span class="room-code-label">Sala</span>
            <span id="roomCodeDisplay" class="room-code"></span>
            <button id="copyRoomCodeBtn" class="copy-code-btn" title="Copiar código da sala" aria-label="Copiar código da sala">📋</button>
          </span>
        </div>

        <div class="room-bar-right">
          <div class="bar-group">
            <button id="startWebcamBtn" class="btn btn-ghost btn-icon" title="Compartilhar Webcam" aria-label="Compartilhar Webcam">📷</button>
            <button id="switchCameraBtn" class="btn btn-ghost btn-icon hidden" title="Trocar câmera" aria-label="Trocar câmera">🔄</button>
          </div>

          <span class="bar-divider"></span>

          <div class="bar-group">
            <div class="participants-control">
              <button id="participantsBtn" class="btn btn-ghost btn-icon" title="Participantes" aria-label="Participantes">👥 <span id="participantsCount">0</span></button>

              <div id="participantsPanel" class="participants-panel hidden">
                <div class="field-label">Participantes</div>
                <div id="participantsList" class="participants-list"></div>
              </div>
            </div>

            <button id="copyLinkBtn" class="btn btn-ghost btn-icon" title="Copiar link" aria-label="Copiar link">🔗</button>
          </div>

          <span class="bar-divider"></span>

          <div class="bar-group">
            <div class="share-control">
              <button id="startShareBtn" class="btn btn-primary">🖥️ Iniciar Compartilhamento</button>
              <button id="switchSourceBtn" class="btn btn-ghost btn-icon hidden" title="Trocar tela" aria-label="Trocar tela">🔄</button>

            <div id="sharePanel" class="share-panel hidden">
              <div class="control-group">
                <div>
                  <div class="field-label">Resolução</div>
                  <div id="resolutionGroup" class="segmented" data-value="1280x720" role="group" aria-label="Resolução">
                    <button type="button" data-value="auto" aria-pressed="false">Origem</button>
                    <button type="button" data-value="640x360" aria-pressed="false">360</button>
                    <button type="button" data-value="854x480" aria-pressed="false">480</button>
                    <button type="button" data-value="1280x720" class="active" aria-pressed="true">720</button>
                    <button type="button" data-value="1920x1080" aria-pressed="false">1080</button>
                    <button type="button" data-value="2560x1440" aria-pressed="false">1440</button>
                  </div>
                </div>
                <div>
                  <div class="field-label">Frame rate</div>
                  <div id="framerateGroup" class="segmented" data-value="30" role="group" aria-label="Frame rate">
                    <button type="button" data-value="15" aria-pressed="false">15</button>
                    <button type="button" data-value="30" class="active" aria-pressed="true">30</button>
                    <button type="button" data-value="60" aria-pressed="false">60</button>
                  </div>
                </div>
                <div>
                  <div class="field-label">Bitrate</div>
                  <div id="bitrateGroup" class="segmented" data-value="10000" role="group" aria-label="Bitrate">
                    <button type="button" data-value="" aria-pressed="false">Auto</button>
                    <button type="button" data-value="3000" aria-pressed="false">3 Mbps</button>
                    <button type="button" data-value="6000" aria-pressed="false">6 Mbps</button>
                    <button type="button" data-value="10000" class="active" aria-pressed="true">10 Mbps</button>
                    <button type="button" data-value="20000" aria-pressed="false">20 Mbps</button>
                    <button type="button" data-value="30000" aria-pressed="false">30 Mbps</button>
                    <button type="button" data-value="50000" aria-pressed="false">50 Mbps</button>
                  </div>
                </div>
              </div>
              <button id="confirmShareBtn" class="btn btn-primary">🖥️ Compartilhar</button>
            </div>
            </div>

            <button id="leaveRoomBtn" class="btn btn-ghost btn-icon" title="Sair da Sala" aria-label="Sair da Sala">🚪</button>
          </div>
        </div>
      </div>

      <!-- Persistent bottom-left identity/voice bar, Discord-style — fixed to
           the viewport (not part of .room-content's flow) so it stays put
           regardless of scroll or which server/channel view is open. Lives
           for both guests and signed-in accounts (unlike #serverSidebar,
           which is account-only), since mute/deafen matter to everyone once
           inside a room. -->
      <div id="userBarWrap" class="user-bar-wrap">
        <!-- Only shown while connected — mirrors Discord's own "leave this
             voice channel" affordance living apart from mute/deafen, which
             keeps the main row below down to 3 icons instead of 4. -->
        <div id="voiceConnectedBar" class="voice-connected-bar hidden">
          <span>🎧 No áudio</span>
          <button id="voiceLeaveBtn" class="voice-disconnect-btn" title="Sair do áudio" aria-label="Sair do áudio"><span class="voice-disconnect-icon">📞</span></button>
        </div>
        <div id="userBar" class="user-bar">
          <div id="userBarPopover" class="user-bar-popover hidden">
            <div class="field-label">Microfone</div>
            <select id="voiceMicSelect" class="voice-mic-select" aria-label="Microfone"></select>

            <div id="userBarSpeakerRow" class="hidden">
              <div class="field-label">Saída de áudio</div>
              <select id="voiceSpeakerSelect" class="voice-mic-select" aria-label="Saída de áudio"></select>
            </div>

            <div id="userBarLogoutRow" class="user-bar-logout-row hidden">
              <button id="userBarLogoutBtn" type="button" class="btn-link">Sair da conta</button>
            </div>
          </div>
          <span id="userBarAvatar" class="user-bar-avatar"></span>
          <div class="user-bar-info">
            <span id="userBarName" class="user-bar-name"></span>
            <span id="userBarStatus" class="user-bar-status">Desconectado</span>
          </div>
          <div class="user-bar-controls">
            <button id="voiceJoinBtn" class="btn btn-voice-join btn-icon" title="Entrar no áudio" aria-label="Entrar no áudio">🎧</button>
            <div id="voiceActiveControls" class="voice-active-controls hidden">
              <button id="voiceMuteBtn" class="btn btn-ghost btn-icon" aria-pressed="false" title="Silenciar microfone">🎤</button>
              <button id="voiceDeafenBtn" class="btn btn-ghost btn-icon" aria-pressed="false" title="Ensurdecer">🎧</button>
            </div>
            <button id="userBarSettingsBtn" class="btn btn-ghost btn-icon" title="Configurações" aria-label="Configurações" aria-expanded="false" aria-haspopup="true">⚙️</button>
          </div>
        </div>
      </div>

      <div class="room-content">
        <div id="videos" class="video-grid"></div>
      </div>

      <!-- Floating launcher, not part of the room bar — chat is a separate,
           always-reachable corner of the screen rather than one more item
           competing for space in the toolbar. Hidden while the panel itself
           is open (chat.js toggles the wrapper's .hidden class). -->
      <div class="chat-control">
        <button id="chatToggleBtn" aria-label="Chat">
          💬
          <span id="chatBadge" class="chat-badge hidden">0</span>
        </button>
      </div>

      <div id="chatPanel" class="chat-panel hidden">
        <div class="chat-panel-header">
          <span>Chat</span>
          <button id="chatCloseBtn" class="chat-close-btn" aria-label="Fechar chat">✕</button>
        </div>
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-input-row">
          <input id="chatInput" type="text" placeholder="Mensagem..." maxlength="500">
          <button id="chatSendBtn" class="btn btn-primary">Enviar</button>
        </div>
      </div>
    </div>
    </main>

    <!-- Persistent Discord-style member list — everyone in the room, not
         just voice (each row already carries a 🎧 badge + speaking ring
         when applicable, see participants.js). A true flex sibling of
         #serverSidebar/main (not nested inside .room-content) so it reserves
         its own layout space the same way the sidebar does on the left —
         that's what keeps the room-bar/video area actually centered between
         them instead of drifting left. lobby.js toggles the JS-driven
         .hidden alongside #appScreen's own show/hide (only relevant in a
         room); the width-driven breakpoint below is separate — narrower
         viewports fall back to the #participantsPanel dropdown instead
         (see .participants-control). -->
    <aside id="memberList" class="member-list hidden">
      <div class="field-label">Participantes</div>
      <div id="memberListItems" class="participants-list"></div>
    </aside>
  </div>

  <footer class="app-footer">Em homenagem ao meu amigo Lucas Demétrio</footer>

  <div id="toastContainer" class="toast-container"></div>

  <!-- Socket.io client; js/main.js (ES module) does raw WebRTC signaling over it -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- Public Supabase config (see server.js) — must load before main.js,
       whose module graph reads window.SUPABASE_URL/ANON_KEY at import time. -->
  <script src="/config.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
