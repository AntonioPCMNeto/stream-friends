<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrima aí</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">🖥️ Scrima aí v0.12</header>

  <main>
    <div id="lobby" class="card">
      <h2>Entre em uma sala</h2>
      <p id="welcomeBack" class="welcome-back hidden"></p>
      <label class="field">
        <span>Seu Nick</span>
        <input id="usernameInput" type="text" placeholder="ex.: João" maxlength="30">
      </label>
      <label class="field">
        <span>Código da Sala</span>
        <input id="roomCodeInput" type="text" placeholder="Deixe em branco para criar uma sala" maxlength="30">
      </label>
      <p id="lobbyError" class="error"></p>
      <button id="enterBtn" class="btn btn-primary">Entrar na Sala</button>
    </div>

    <div id="appScreen" style="display: none;">
      <div class="room-bar">
        <div class="room-bar-left">
          <span id="connectionDot" class="connection-dot disconnected" title="Conectando..."></span>
          <span class="room-code-wrap">
            <span class="room-code-label">Sala</span>
            <span id="roomCodeDisplay" class="room-code"></span>
            <button id="copyRoomCodeBtn" class="copy-code-btn" title="Copiar código da sala" aria-label="Copiar código da sala">📋</button>
          </span>
        </div>

        <div class="room-bar-right">
          <div class="participants-control">
            <button id="participantsBtn" class="btn btn-ghost">👥 <span id="participantsCount">0</span></button>

            <div id="participantsPanel" class="participants-panel hidden">
              <div class="field-label">Participantes</div>
              <div id="participantsList" class="participants-list"></div>
            </div>
          </div>

          <button id="copyLinkBtn" class="btn btn-ghost">🔗 Copiar link</button>

          <div class="share-control">
            <button id="startShareBtn" class="btn btn-primary">🖥️ Iniciar Compartilhamento</button>

            <div id="sharePanel" class="share-panel hidden">
              <div class="control-group">
                <div>
                  <div class="field-label">Resolução</div>
                  <div id="resolutionGroup" class="segmented" data-value="1280x720" role="group" aria-label="Resolução">
                    <button type="button" data-value="auto" aria-pressed="false">Origem</button>
                    <button type="button" data-value="640x360" aria-pressed="false">360</button>
                    <button type="button" data-value="854x480" aria-pressed="false">480</button>
                    <button type="button" data-value="1280x720" class="active" aria-pressed="true">720</button>
                    <button type="button" data-value="1920x1080" aria-pressed="false">1080</button>
                    <button type="button" data-value="2560x1440" aria-pressed="false">1440</button>
                  </div>
                </div>
                <div>
                  <div class="field-label">Frame rate</div>
                  <div id="framerateGroup" class="segmented" data-value="30" role="group" aria-label="Frame rate">
                    <button type="button" data-value="15" aria-pressed="false">15</button>
                    <button type="button" data-value="30" class="active" aria-pressed="true">30</button>
                    <button type="button" data-value="60" aria-pressed="false">60</button>
                  </div>
                </div>
                <div>
                  <div class="field-label">Bitrate</div>
                  <div id="bitrateGroup" class="segmented" data-value="10000" role="group" aria-label="Bitrate">
                    <button type="button" data-value="" aria-pressed="false">Auto</button>
                    <button type="button" data-value="3000" aria-pressed="false">3 Mbps</button>
                    <button type="button" data-value="6000" aria-pressed="false">6 Mbps</button>
                    <button type="button" data-value="10000" class="active" aria-pressed="true">10 Mbps</button>
                    <button type="button" data-value="20000" aria-pressed="false">20 Mbps</button>
                    <button type="button" data-value="30000" aria-pressed="false">30 Mbps</button>
                    <button type="button" data-value="50000" aria-pressed="false">50 Mbps</button>
                  </div>
                </div>
              </div>
              <button id="confirmShareBtn" class="btn btn-primary">🖥️ Compartilhar</button>
            </div>
          </div>

          <button id="leaveRoomBtn" class="btn btn-ghost">🚪 Sair da Sala</button>
        </div>
      </div>

      <div id="videos" class="video-grid"></div>
    </div>
  </main>

  <footer class="app-footer">Em homenagem ao meu amigo Lucas Demétrio</footer>

  <div id="toastContainer" class="toast-container"></div>

  <!-- Socket.io client; js/main.js (ES module) does raw WebRTC signaling over it -->
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
