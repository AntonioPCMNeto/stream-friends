<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrima aí</title>
  <style>
    :root {
      --bg: #0b0b10;
      --surface: #16161d;
      --surface-2: #1e1e28;
      --border: #2a2a35;
      --text: #f2f2f5;
      --text-dim: #9a9aa5;
      --accent: #6366f1;
      --accent-hover: #7577f3;
      --danger: #ff6b6b;
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #1a1a25, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
    }

    .app-header {
      padding: 20px 32px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    main {
      padding: 0 20px 60px;
    }

    .btn {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { background: #444; cursor: not-allowed; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
    .btn-ghost:hover { color: var(--text); border-color: var(--accent); }
    .btn-danger { background: #ef4444; color: white; }
    .btn-danger:hover { background: #f16060; }

    /* Lobby */
    .card {
      max-width: 380px;
      margin: 80px auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }
    .card h2 { margin: 0 0 20px; font-size: 18px; }

    .field { display: block; margin-bottom: 16px; text-align: left; }
    .field span { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
    .field input {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      transition: border-color 0.15s;
    }
    .field input:focus { outline: none; border-color: var(--accent); }

    .error { color: var(--danger); font-size: 13px; min-height: 18px; margin: 0 0 8px; }

    #enterBtn { width: 100%; }

    #startShareBtn { margin-left: auto; }

    /* App screen */
    .toolbar {
      max-width: 1100px;
      margin: 12px auto 0;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .control-group { display: flex; gap: 16px; }
    .field-label {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .segmented {
      display: flex;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px;
      gap: 2px;
    }
    .segmented button {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .segmented button:hover { color: var(--text); }
    .segmented button.active { background: var(--accent); color: white; }

    .status-row {
      max-width: 1100px;
      margin: 16px auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .status-badge {
      font-size: 13px;
      color: var(--text-dim);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
    }

    /* Video grid */
    .video-grid {
      max-width: 1100px;
      margin: 24px auto 0;
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      justify-content: center;
    }
    .tile {
      position: relative;
      width: 400px;
      max-width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: var(--radius);
      overflow: hidden;
      background: #000;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .tile video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }
    .tile:fullscreen {
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      aspect-ratio: auto;
      border-radius: 0;
    }
    .tile-overlay {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
    }
    .tile-label {
      font-size: 13px;
      font-weight: 600;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tile-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.55);
      color: white;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .icon-btn:hover { background: rgba(0, 0, 0, 0.8); }
  </style>
</head>
<body>
  <header class="app-header">🖥️ Scrima aí</header>

  <main>
    <div id="lobby" class="card">
      <h2>Entre em uma sala</h2>
      <label class="field">
        <span>Seu Nick</span>
        <input id="usernameInput" type="text" placeholder="ex.: João" maxlength="30">
      </label>
      <label class="field">
        <span>Código da Sala</span>
        <input id="roomCodeInput" type="text" placeholder="Deixe em branco para criar uma sala" maxlength="30">
      </label>
      <p id="lobbyError" class="error"></p>
      <button id="enterBtn" class="btn btn-primary">Entrar na Sala</button>
    </div>

    <div id="appScreen" style="display: none;">
      <div class="toolbar">
        <div id="shareOptions" class="control-group">
          <div>
            <div class="field-label">Resolução</div>
            <div id="resolutionGroup" class="segmented" data-value="1280x720">
              <button type="button" data-value="auto">Origem</button>
              <button type="button" data-value="640x360">360</button>
              <button type="button" data-value="854x480">480</button>
              <button type="button" data-value="1280x720" class="active">720</button>
              <button type="button" data-value="1920x1080">1080</button>
              <button type="button" data-value="2560x1440">1440</button>
            </div>
          </div>
          <div>
            <div class="field-label">Frame rate</div>
            <div id="framerateGroup" class="segmented" data-value="30">
              <button type="button" data-value="15">15</button>
              <button type="button" data-value="30" class="active">30</button>
              <button type="button" data-value="60">60</button>
            </div>
          </div>
        </div>
        <button id="startShareBtn" class="btn btn-primary">🖥️ Iniciar Compartilhamento</button>
      </div>

      <div class="status-row">
        <span id="roomCodeDisplay" class="status-badge"></span>
        <span id="status" class="status-badge">Inicializando conexão...</span>
        <button id="copyLinkBtn" class="btn btn-ghost">🔗 Copiar link da sala</button>
      </div>

      <div id="videos" class="video-grid"></div>
    </div>
  </main>

  <!-- Include Socket.io via CDN; app.js does raw WebRTC signaling over it -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
